name: zenoh

networks:
  routers:
    ipam:
      driver: default
      config:
        - subnet: 172.20.1.0/24
  mesh_a:
    ipam:
      driver: default
      config:
        - subnet: 172.20.2.0/24
  mesh_b:
    ipam:
      driver: default
      config:
        - subnet: 172.20.3.0/24

x-service-template: &service-template
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    - RUST_LOG=debug
  expose:
    - 80
  restart: no
  stop_signal: SIGINT
  healthcheck:
    test: [ "CMD", "curl", "-f", "http://localhost/@" ]
    interval: 3s
    timeout: 10s
    retries: 5

services:

  # Network A

  router_a:
    <<: *service-template
    networks:
      routers:
        ipv4_address: 172.20.1.2
      mesh_a:
        ipv4_address: 172.20.2.2
    command: [
      "-c", "/etc/zenohd/router.json",
      "--connect", "tcp/172.20.1.3:7447"
    ]

  peer_a1:
    <<: *service-template
    depends_on:
      router_a:
        condition: service_healthy
    networks:
      mesh_a:
        ipv4_address: 172.20.2.3
    command: [
      "-c", "/etc/zenohd/peer.json",
      "--connect", "tcp/172.20.2.2:7447"
    ]

  # peer_a2:
  #   <<: *service-template
  #   networks:
  #     mesh_a:
  #       ipv4_address: 172.20.2.4
  #   command: [
  #     "-c", "/etc/zenohd/peer.json",
  #   ]

  peer_ax:
    <<: *service-template
    depends_on:
      peer_a1:
        condition: service_healthy
      # peer_a2:
      #   condition: service_healthy
    networks:
      mesh_a:
    command: [
      "-c", "/etc/zenohd/peer.json"
    ]
    deploy:
      mode: replicated
      replicas: 9

  client_ax:
    <<: *service-template
    depends_on:
      peer_a1:
        condition: service_healthy
      # peer_a2:
      #   condition: service_healthy
      peer_ax:
        condition: service_healthy
    networks:
      mesh_a:
    command: [
      "-c", "/etc/zenohd/client.json"
    ]
    deploy:
      mode: replicated
      replicas: 2

  # Network B

  router_b:
    <<: *service-template
    networks:
      routers:
        ipv4_address: 172.20.1.3
      mesh_b:
        ipv4_address: 172.20.3.2
    command: [
      "-c", "/etc/zenohd/router.json",
      "--connect", "tcp/172.20.1.2:7447"
    ]

  peer_b1:
    <<: *service-template
    depends_on:
      router_b:
        condition: service_healthy
    networks:
      mesh_b:
        ipv4_address: 172.20.3.3
    command: [
      "-c", "/etc/zenohd/peer.json",
      "--connect", "tcp/172.20.3.2:7447"
    ]

  # peer_b2:
  #   <<: *service-template
  #   networks:
  #     mesh_b:
  #       ipv4_address: 172.20.3.4
  #   command: [
  #     "-c", "/etc/zenohd/peer.json",
  #   ]

  peer_bx:
    <<: *service-template
    depends_on:
      peer_b1:
        condition: service_healthy
      # peer_b2:
      #   condition: service_healthy
    networks:
      mesh_b:
    command: [
      "-c", "/etc/zenohd/peer.json"
    ]
    deploy:
      mode: replicated
      replicas: 9

  client_bx:
    <<: *service-template
    depends_on:
      peer_b1:
        condition: service_healthy
      # peer_b2:
      #   condition: service_healthy
      peer_bx:
        condition: service_healthy
    networks:
      mesh_b:
    command: [
      "-c", "/etc/zenohd/client.json"
    ]
    deploy:
      mode: replicated
      replicas: 2
